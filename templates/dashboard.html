<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot Hoster · Overview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 760px; }
        header { margin-bottom: 1.5rem; }
        h1 { color: #38bdf8; font-size: 1.7rem; letter-spacing: -0.5px; }
        .sub { color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem; }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1rem;
        }
        .status-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.35rem 0.9rem; border-radius: 9999px;
            font-weight: 600; font-size: 0.8rem;
        }
        .status-badge::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: currentColor; box-shadow: 0 0 8px currentColor;
        }
        .running { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .starting { background: #78350f; color: #fbbf24; border: 1px solid #d97706; }
        .crashed { background: #7f1d1d; color: #f87171; border: 1px solid #dc2626; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        .stat {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
        .stat .num { font-size: 1.9rem; font-weight: 700; color: #38bdf8; }
        .stat .label { font-size: 0.78rem; color: #94a3b8; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .section-title { font-weight: 600; margin-bottom: 0.75rem; color: #f1f5f9; font-size: 0.95rem; }
        .upload-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .upload-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.65rem 0.85rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            border-radius: 10px;
            font-size: 0.85rem;
        }
        .upload-name { color: #f1f5f9; font-weight: 600; }
        .upload-meta { color: #64748b; font-size: 0.78rem; }
        .empty { color: #64748b; font-style: italic; font-size: 0.85rem; padding: 0.75rem 0; text-align: center; }
        .refresh { font-size: 0.75rem; color: #475569; text-align: right; margin-top: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Bot Hoster</h1>
            <div class="sub">Live Overview · Auto-refresh every 5s</div>
        </header>

        <div class="card">
            <div class="status-row">
                <span style="color:#94a3b8; font-size:0.85rem;">Service Status</span>
                <span id="status-badge" class="status-badge starting">Loading…</span>
            </div>
            <div class="grid">
                <div class="stat">
                    <div class="num" id="hosted-count">0</div>
                    <div class="label">Hosted Bots</div>
                </div>
                <div class="stat">
                    <div class="num" id="upload-count">0</div>
                    <div class="label">Total Uploads</div>
                </div>
                <div class="stat">
                    <div class="num" id="last-upload" style="font-size:1rem; word-break:break-all;">—</div>
                    <div class="label">Last Upload</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">📁 Recent Uploads</div>
            <div class="upload-list" id="upload-list">
                <div class="empty">Abhi koi upload nahi hua.</div>
            </div>
            <div class="refresh" id="refresh-time"></div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status', { cache: 'no-store' });
                const data = await res.json();

                const badge = document.getElementById('status-badge');
                badge.textContent = data.status;
                const s = (data.status || '').toLowerCase();
                badge.className = 'status-badge ' +
                    (s === 'running' ? 'running' : s === 'crashed' ? 'crashed' : 'starting');

                document.getElementById('hosted-count').textContent = data.hosted_bots || 0;
                document.getElementById('upload-count').textContent = data.total_uploads || 0;
                document.getElementById('last-upload').textContent = data.last_upload || '—';

                const list = document.getElementById('upload-list');
                if (data.uploads && data.uploads.length > 0) {
                    const recent = data.uploads.slice().reverse().slice(0, 5);
                    list.innerHTML = recent.map(u => `
                        <div class="upload-item">
                            <span class="upload-name">📄 ${u.name}</span>
                            <span class="upload-meta">@${u.username} · ${Math.round((u.size || 0) / 1024)} KB</span>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty">Abhi koi upload nahi hua.</div>';
                }

                document.getElementById('refresh-time').textContent =
                    'Last updated: ' + new Date().toLocaleTimeString();
            } catch (e) {
                console.error('Status fetch failed:', e);
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
